<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pollos King</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="menu-page">
    <section class="hero">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <span class="eyebrow">Av. Estación Santa Fe</span>
        <h1 id="menuTitle">Pollos King</h1>
        <p>El Rey del sabor</p>
        <a href="#menu" class="hero-button">Ver menú</a>
      </div>
    </section>

    <section id="menu" class="menu-section">
      <div class="section-heading">
        <span>🍗</span>
        <h2>Nuestro menú</h2>
        <span>🍟</span>
      </div>
      <p class="section-subtitle">Listado de todos nuestros productos.</p>
      <div id="productGrid" class="product-grid"></div>
    </section>

    <footer>
      <strong id="footerTitle">Pollos King</strong>
      <span>Av. Estación Santa Fe</span>
    </footer>
  </main>
  <script src="js/menu.js"></script>
</body>
</html>
